name: .NET Tests

on:
  workflow_dispatch:
  push:
    branches: ["BASKENT-DOVIZ", "main"]
  pull_request:
    branches: ["BASKENT-DOVIZ", "main"]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore BaskentEnerji.sln

      - name: Build
        run: dotnet build BaskentEnerji.sln --no-restore --configuration Release
