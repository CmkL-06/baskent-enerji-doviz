name: Deploy Frontend to GoDaddy

on:
  push:
    branches: [ BASKENT-DOVIZ ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.baskentenerji.com/api/v1
        run: npm run build

      - name: Inject enhance scripts into index.html
        run: |
          sed -i 's|</body>|    <script src="/assets/office-pages.js"></script>\n    <script src="/assets/dashboard-enhance.js"></script>\n  </body>|' frontend/dist/index.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/index.html
      - name: Force upload index.html via curl
        run: |
          curl --ftp-create-dirs -T frontend/dist/index.html \
            "ftp://${{ secrets.FTP_SERVER }}/index.html" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-ssl-reqd || \
          curl --ftp-create-dirs -T frontend/dist/index.html \
            "ftp://${{ secrets.FTP_SERVER }}/index.html" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
