name: Deploy MTT Frontend to GoDaddy

on:
  push:
    branches: [ BASKENT-DOVIZ ]
    paths:
      - 'MoneyTransferTurkey/frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: MoneyTransferTurkey/frontend
        run: npm install
      - name: Build
        working-directory: MoneyTransferTurkey/frontend
        env:
          VITE_API_BASE_URL: https://api.baskentenerji.com
        run: npm run build
      - name: Deploy to GoDaddy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: MoneyTransferTurkey/frontend/dist/
          server-dir: /public_html/moneytransferturkey.com/
          dangerous-clean-slate: true
