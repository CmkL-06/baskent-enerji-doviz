<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Başkent Enerji Döviz — Giriş</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --muted: #64748b;
      --primary: #0ea5e9;
      --bg1: #1e293b;
      --bg2: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 390px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    h1 { font-size: 1.45rem; margin-bottom: 0.35rem; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
    .form { display: flex; flex-direction: column; gap: 0.95rem; }
    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    .field label { font-size: 0.9rem; font-weight: 500; }
    .field input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
    }
    .btn {
      border: 0;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 0.15rem;
    }
    .hint {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Başkent Enerji Döviz</h1>
    <p class="subtitle">API: /api/v1/User/login</p>
    <form class="form" onsubmit="return false;">
      <div class="field">
        <label>E-posta</label>
        <input type="email" placeholder="ornek@email.com" />
      </div>
      <div class="field">
        <label>Şifre</label>
        <input type="password" placeholder="••••••••" />
      </div>
      <button class="btn" type="submit">Giriş</button>
    </form>
    <p class="hint">Önizleme ekranı: canlı doğrulama için Vue uygulaması + API birlikte çalıştırılmalıdır.</p>
  </div>
</body>
</html>
