<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayi Paneli – Money Transfer Turkey</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --mtt-primary: #1a3c5e;
      --mtt-accent:  #2e86c1;
      --mtt-gold:    #f0a500;
      --mtt-bg:      #0d1b2a;
      --mtt-card:    #132840;
      --mtt-border:  rgba(46,134,193,0.2);
    }
    body { background: var(--mtt-bg); color: #e0e8f0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

    /* Topbar */
    .topbar {
      background: linear-gradient(90deg, #0d2a45, #1a3c5e);
      border-bottom: 1px solid var(--mtt-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar .brand { display: flex; align-items: center; gap: 10px; }
    .topbar .brand .icon {
      width: 36px; height: 36px; background: var(--mtt-gold);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #0d2a45; font-size: 16px;
    }
    .topbar .brand h2 { margin: 0; font-size: 1rem; font-weight: 700; color: #fff; }
    .topbar .brand small { color: rgba(255,255,255,0.5); font-size: 0.75rem; }
    .topbar .user-area { display: flex; align-items: center; gap: 12px; }
    .dealer-badge {
      background: rgba(240,165,0,0.15); color: var(--mtt-gold);
      border: 1px solid rgba(240,165,0,0.3); border-radius: 20px;
      padding: 3px 12px; font-size: 0.75rem; font-weight: 600;
    }
    .dealer-name { color: #fff; font-size: 0.9rem; font-weight: 600; }
    .btn-logout {
      background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.3);
      color: #ff6b6b; border-radius: 6px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer;
    }
    .btn-logout:hover { background: rgba(220,53,69,0.25); }

    /* Stats */
    .stats-row { padding: 24px 24px 0; gap: 16px; }
    .stat-card {
      background: var(--mtt-card);
      border: 1px solid var(--mtt-border);
      border-radius: 12px; padding: 20px;
      flex: 1; min-width: 180px;
    }
    .stat-card .stat-label { font-size: 0.8rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; color: #fff; }
    .stat-card .stat-currency { font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-left: 4px; }
    .stat-card.balance { border-left: 3px solid var(--mtt-gold); }
    .stat-card.given-tl  { border-left: 3px solid #27ae60; }
    .stat-card.usdt      { border-left: 3px solid #f39c12; }
    .stat-card.rub       { border-left: 3px solid #8e44ad; }

    /* QR + info */
    .qr-section {
      background: var(--mtt-card); border: 1px solid var(--mtt-border);
      border-radius: 12px; padding: 20px;
    }
    .qr-section h6 { color: rgba(255,255,255,0.5); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.8px; }
    .qr-section .qr-link {
      font-size: 0.78rem; color: var(--mtt-accent);
      word-break: break-all; text-decoration: none;
    }
    #qrCanvas { border-radius: 8px; background: #fff; padding: 6px; }

    /* Transactions */
    .main-area { padding: 20px 24px 40px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { font-size: 1rem; font-weight: 700; color: #fff; }
    .tab-pills { display: flex; gap: 6px; }
    .tab-pills .pill {
      padding: 5px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
      border: 1px solid var(--mtt-border); color: rgba(255,255,255,0.5);
      background: transparent; transition: all 0.2s;
    }
    .tab-pills .pill.active { background: var(--mtt-accent); border-color: var(--mtt-accent); color: #fff; }

    .table-wrap {
      background: var(--mtt-card); border: 1px solid var(--mtt-border);
      border-radius: 12px; overflow: hidden;
    }
    .table { margin: 0; }
    .table thead th {
      background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.5);
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.8px;
      border-bottom: 1px solid var(--mtt-border); padding: 12px 16px;
    }
    .table tbody td {
      color: #c8d8e8; font-size: 0.88rem; padding: 12px 16px;
      border-bottom: 1px solid rgba(46,134,193,0.08);
      vertical-align: middle;
    }
    .table tbody tr:hover { background: rgba(46,134,193,0.05); }
    .table tbody tr:last-child td { border-bottom: none; }

    .badge-tamamlandi { background: rgba(39,174,96,0.15); color: #2ecc71; border: 1px solid rgba(39,174,96,0.3); border-radius: 20px; padding: 3px 10px; font-size: 0.75rem; }
    .badge-bekliyor   { background: rgba(241,196,15,0.15); color: #f1c40f; border: 1px solid rgba(241,196,15,0.3); border-radius: 20px; padding: 3px 10px; font-size: 0.75rem; }
    .badge-islemde    { background: rgba(46,134,193,0.15); color: #3498db; border: 1px solid rgba(46,134,193,0.3); border-radius: 20px; padding: 3px 10px; font-size: 0.75rem; }
    .badge-iptal      { background: rgba(220,53,69,0.15); color: #ff6b6b; border: 1px solid rgba(220,53,69,0.3); border-radius: 20px; padding: 3px 10px; font-size: 0.75rem; }

    .tx-code { font-family: monospace; color: var(--mtt-gold); font-size: 0.82rem; }
    .loading-row td { text-align: center; padding: 40px; color: rgba(255,255,255,0.3); }
    .empty-row td  { text-align: center; padding: 40px; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="brand">
    <div class="icon"><i class="fa-solid fa-money-bill-transfer"></i></div>
    <div>
      <h2>Money Transfer Turkey</h2>
      <small id="dealerCode">Bayi Paneli</small>
    </div>
  </div>
  <div class="user-area">
    <span class="dealer-badge">BAYİ</span>
    <span class="dealer-name" id="dealerNameDisplay">Yükleniyor...</span>
    <button class="btn-logout" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket me-1"></i>Çıkış
    </button>
  </div>
</div>

<!-- Stats Row -->
<div class="d-flex flex-wrap stats-row">
  <div class="stat-card balance">
    <div class="stat-label"><i class="fa-solid fa-wallet me-1"></i> Bakiye</div>
    <div><span class="stat-value" id="statBalance">—</span><span class="stat-currency">TL</span></div>
  </div>
  <div class="stat-card given-tl">
    <div class="stat-label"><i class="fa-solid fa-arrow-up me-1"></i> Verilen Toplam TL</div>
    <div><span class="stat-value" id="statGivenTL">—</span><span class="stat-currency">TL</span></div>
  </div>
  <div class="stat-card usdt">
    <div class="stat-label"><i class="fa-solid fa-coins me-1"></i> Alınan USDT</div>
    <div><span class="stat-value" id="statUsdt">—</span><span class="stat-currency">USDT</span></div>
  </div>
  <div class="stat-card rub">
    <div class="stat-label"><i class="fa-solid fa-ruble-sign me-1"></i> Alınan RUB</div>
    <div><span class="stat-value" id="statRub">—</span><span class="stat-currency">RUB</span></div>
  </div>

  <!-- QR Card -->
  <div class="qr-section ms-auto" style="min-width:200px;">
    <h6><i class="fa-brands fa-telegram me-1"></i> Telegram Bot QR</h6>
    <canvas id="qrCanvas" width="128" height="128"></canvas>
    <div class="mt-2">
      <a id="qrLink" href="#" class="qr-link" target="_blank">—</a>
    </div>
  </div>
</div>

<!-- Transactions -->
<div class="main-area">
  <div class="section-header">
    <span class="section-title"><i class="fa-solid fa-list me-2"></i>İşlemler</span>
    <div class="tab-pills">
      <button class="pill active" onclick="filterTx('all',this)">Tümü</button>
      <button class="pill" onclick="filterTx('completed',this)">Tamamlanan</button>
      <button class="pill" onclick="filterTx('cancelled',this)">İptal Edilen</button>
      <button class="pill" onclick="filterTx('today',this)">Bugün</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>İşlem No</th>
          <th>Müşteri</th>
          <th>Tutar</th>
          <th>Para Birimi</th>
          <th>Vereceğiniz TL</th>
          <th>Kur</th>
          <th>Durum</th>
          <th>İşlem Kodu</th>
          <th>Tarih</th>
        </tr>
      </thead>
      <tbody id="txTableBody">
        <tr class="loading-row"><td colspan="9"><i class="fa-solid fa-spinner fa-spin me-2"></i>Yükleniyor...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- QR Library (simple inline generator) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // baskentenerji.com'dan yönlendirme — URL'den token al
  const _urlParams = new URLSearchParams(window.location.search);
  const _urlToken  = _urlParams.get('token');
  if (_urlToken) {
    localStorage.setItem('mtt_token', _urlToken);
    window.history.replaceState({}, '', window.location.pathname);
  }

  const TOKEN = localStorage.getItem('mtt_token');
  const USER  = JSON.parse(localStorage.getItem('mtt_user') || '{}');

  if (!TOKEN) window.location.href = 'https://baskentenerji.com/mtt-panel';

  let allTransactions = [];
  let currentFilter = 'all';

  function logout() {
    localStorage.removeItem('mtt_token');
    localStorage.removeItem('mtt_user');
    localStorage.removeItem('mtt_panel_type');
    window.location.href = 'https://baskentenerji.com/mtt-panel';
  }

  function fmt(n) { return Number(n).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}); }

  function statusBadge(s) {
    const map = {
      'completed':  '<span class="badge-tamamlandi">Tamamlandı</span>',
      'tamamlandi': '<span class="badge-tamamlandi">Tamamlandı</span>',
      'pending':    '<span class="badge-bekliyor">Bekliyor</span>',
      'bekliyor':   '<span class="badge-bekliyor">Bekliyor</span>',
      'processing': '<span class="badge-islemde">İşlemde</span>',
      'islemde':    '<span class="badge-islemde">İşlemde</span>',
      'cancelled':  '<span class="badge-iptal">İptal</span>',
      'iptal':      '<span class="badge-iptal">İptal</span>',
    };
    return map[s?.toLowerCase()] || `<span>${s}</span>`;
  }

  function renderTable(data) {
    const tbody = document.getElementById('txTableBody');
    if (!data.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="9"><i class="fa-solid fa-inbox me-2"></i>İşlem bulunamadı.</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(tx => `
      <tr>
        <td>#${tx.id}</td>
        <td>${tx.customer_name || tx.customer || '—'}</td>
        <td>${fmt(tx.amount)}</td>
        <td><span class="tx-code">${tx.currency || 'USDT'}</span></td>
        <td>${fmt(tx.tl_amount)}</td>
        <td>${fmt(tx.rate)}</td>
        <td>${statusBadge(tx.status)}</td>
        <td><span class="tx-code">${tx.code || tx.tx_code || '—'}</span></td>
        <td>${new Date(tx.created_at).toLocaleString('tr-TR')}</td>
      </tr>
    `).join('');
  }

  function filterTx(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.tab-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');

    const today = new Date().toDateString();
    let filtered = allTransactions;

    if (filter === 'completed') filtered = allTransactions.filter(t => ['completed','tamamlandi'].includes(t.status?.toLowerCase()));
    else if (filter === 'cancelled') filtered = allTransactions.filter(t => ['cancelled','iptal'].includes(t.status?.toLowerCase()));
    else if (filter === 'today') filtered = allTransactions.filter(t => new Date(t.created_at).toDateString() === today);

    renderTable(filtered);
  }

  function loadDealerData() {
    fetch('/api/dealer/dashboard', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    })
    .then(r => { if (r.status === 401) { logout(); throw new Error('401'); } return r.json(); })
    .then(data => {
      // Stats
      document.getElementById('statBalance').textContent  = fmt(data.balance  || 0);
      document.getElementById('statGivenTL').textContent  = fmt(data.given_tl || 0);
      document.getElementById('statUsdt').textContent     = fmt(data.usdt     || 0);
      document.getElementById('statRub').textContent      = fmt(data.rub      || 0);

      // Header
      const name = data.dealer_name || USER.name || 'Bayi';
      document.getElementById('dealerNameDisplay').textContent = name;
      document.getElementById('dealerCode').textContent = 'Kod: ' + (data.dealer_code || '—');

      // QR
      const tgUrl = `https://t.me/MoneyTransferTurkey_Bot?start=${data.dealer_code}`;
      document.getElementById('qrLink').href = tgUrl;
      document.getElementById('qrLink').textContent = tgUrl;
      new QRCode(document.getElementById('qrCanvas'), { text: tgUrl, width: 128, height: 128, colorDark:'#000', colorLight:'#fff' });

      // Transactions
      allTransactions = data.transactions || [];
      renderTable(allTransactions);
    })
    .catch(err => {
      if (err.message !== '401') {
        document.getElementById('txTableBody').innerHTML =
          '<tr class="empty-row"><td colspan="9"><i class="fa-solid fa-triangle-exclamation me-2" style="color:#ff6b6b"></i>Veriler yüklenemedi.</td></tr>';
      }
    });
  }

  loadDealerData();
  // Auto-refresh every 30 seconds
  setInterval(loadDealerData, 30000);
</script>
</body>
</html>
